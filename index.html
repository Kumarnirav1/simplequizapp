<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrainBoost – Python, DSA &amp; Linux Quiz</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <h1 class="brand"><img src="images/logo.svg" alt="" width="32" height="32"> BrainBoost</h1>

  <button id="backBtn" class="back" type="button" hidden>← Back</button>

  <!-- Start screen -->
  <section id="start" class="hero">
    <div>
      <h2>Find the gaps in your Python, DSA and Linux.</h2>
      <p>Ten questions per subject, shuffled every time, with a short explanation after each answer.</p>
      <button id="startBtn" class="btn" type="button">Choose a subject</button>
    </div>
    <aside class="try" aria-label="Sample question">
      <p class="caption">Sample question. Pick an answer.</p>
      <pre class="code"><code>print("ab" * 2 + "c")</code></pre>
      <p class="try-q">What does this print?</p>
      <div class="try-opts">
        <button class="opt" type="button">abc2</button>
        <button class="opt" type="button" data-correct="1">ababc</button>
        <button class="opt" type="button">ab2c</button>
      </div>
      <p id="tryNote" role="status" aria-live="polite"></p>
    </aside>
  </section>

  <!-- Subject screen -->
  <section id="subjects" hidden>
    <h2>Choose a subject</h2>
    <div id="subjectList" class="subjects"></div>
  </section>

  <!-- Quiz screen -->
  <section id="quiz" class="card" hidden>
    <div class="meta">
      <span id="progressText"></span>
      <span id="scoreText"></span>
    </div>
    <div class="bar" role="progressbar" aria-label="Quiz progress"><div id="barFill"></div></div>
    <span id="category" class="tag"></span>
    <h2 id="question"></h2>
    <div id="options" class="options"></div>
    <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>
    <button id="nextBtn" class="btn" type="button" hidden>Next</button>
  </section>

  <!-- Result screen -->
  <section id="result" class="card center" hidden>
    <h2 id="resultTitle">Quiz complete!</h2>
    <div id="ring" class="ring"><span id="pct"></span></div>
    <p id="summary" class="big"></p>
    <p id="message" class="muted"></p>
    <p id="bestResult" class="muted"></p>
    <div class="actions">
      <button id="againBtn" class="btn" type="button">Try again</button>
      <button id="changeBtn" class="btn ghost" type="button">Change subject</button>
      <button id="reviewBtn" class="btn ghost" type="button">Review answers</button>
    </div>
    <ol id="review" class="review" hidden></ol>
  </section>
</main>
<script src="questions.js"></script>
<script src="script.js"></script>
</body>
</html>
